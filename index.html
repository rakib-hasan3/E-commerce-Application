<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- title & logo -->
    <title>E-Commerce Application | Best collection for your shopping</title>
    <link rel="stylesheet" href="./Assets/banner-image.png">

    <!-- font awesome -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link

<body>

    <!-- nav section -->
    <div class="navbar bg-base-100 shadow-sm">

        <div class="navbar-start">

            <a class="btn btn-ghost text-xl lg:pl-60">SwiftCart</a>
        </div>
        <div class="navbar-center hidden lg:flex">
            <ul class="menu menu-horizontal   gap-2">
                <li><a>Home</a></li>
                <li><a>Product</a></li>
                <li><a>About</a></li>
                <li><a>Contact</a></li>
            </ul>
        </div>
        <div class="navbar-end lg:pr-60">
            <div tabindex="0" role="button" class="btn btn-ghost btn-circle">
                <div class="indicator">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                    </svg>
                    <span class="badge badge-sm indicator-item">8</span>
                </div>
            </div>
            <div class="dropdown">
                <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h8m-8 6h16" />
                    </svg>
                </div>
                <ul tabindex="-1"
                    class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow">
                    <li><a>Home</a></li>
                    <li><a>Product</a></li>
                    <li><a>About</a></li>
                    <li><a>Contact</a></li>
                </ul>
            </div>
        </div>
    </div>
    <!-- hero secion -->
    <div class="hero  min-h-[600px] w-full mx-auto" style="background-image: url(/Assets/banner-image.png);">
        <div class="hero-overlay bg-gradient-to-r from-blue-950/50 "></div>
        <div class="hero-content text-neutral-content ">
            <div class="max-w-screen-lg">
                <h1 class="mb-5 text-6xl font-bold">Best Collection For You</h1>
                <p class="mb-5 text-xl w-175">
                    Discover the latest trends in fashion, electronics, and more. Shop with confidence and style at
                    SwiftCart
                </p>
                <button class="btn btn-primary btn-lg rounded-lg">Shop Now</button>
            </div>
        </div>
    </div>
